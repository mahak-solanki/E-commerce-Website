<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Annapurna Bhakti Bhandar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container">
  <div id="successContent" class="success-box"><div class="spinner"></div></div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
async function loadOrder() {
  const orderId = new URLSearchParams(window.location.search).get("order_id");
  const el = document.getElementById("successContent");
  if (!orderId) { el.innerHTML = "<p>No order specified.</p>"; return; }

  try {
    const order = await api.getOrder(orderId);
    el.innerHTML = `
      <div class="success-icon">✅</div>
      <h1>Order Placed Successfully!</h1>
      <p style="color:var(--brown-soft);">We will contact you shortly to confirm your order.</p>

      <div class="order-summary-card">
        <div class="summary-row"><span>Order ID</span><strong>${order.order_id}</strong></div>
        <div class="summary-row"><span>Customer Name</span><span>${order.customer_name}</span></div>
        <div class="summary-row"><span>Phone</span><span>${order.phone}</span></div>
        <div class="summary-row"><span>Delivery Address</span><span style="text-align:right;max-width:60%;">${order.address}, ${order.city}, ${order.state} - ${order.pincode}</span></div>
        <div class="summary-row"><span>Payment Method</span><span>${order.payment_method}</span></div>
        <div class="summary-row"><span>Order Status</span><span class="status-pill">${order.order_status}</span></div>
        <hr style="border:none;border-top:1px solid #eee;margin:14px 0;">
        <h4 style="margin:0 0 10px;">Items</h4>
        ${order.items.map(i => `
          <div class="summary-row"><span>${i.product_name_snapshot} × ${i.quantity}</span><span>${money(i.subtotal)}</span></div>
        `).join("")}
        <div class="summary-row"><span>Subtotal</span><span>${money(order.subtotal_amount)}</span></div>
        <div class="summary-row"><span>Delivery Charge</span><span>${order.delivery_charge === 0 ? "FREE" : money(order.delivery_charge)}</span></div>
        <div class="summary-row total"><span>Total</span><span>${money(order.total_amount)}</span></div>
      </div>

      <div style="margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
        <a href="products.html" class="btn btn-primary">Continue Shopping</a>
        <a href="index.html" class="btn btn-outline-maroon">Back to Home</a>
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<h3>Could not find this order</h3><p>${e.message}</p><a href="index.html" class="btn btn-primary">Back to Home</a>`;
  }
}

loadOrder();
mountLayout("");
</script>
</body>
</html>
