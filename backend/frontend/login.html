<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Annapurna Bhakti Bhandar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="login-wrap">
  <div class="login-card">
    <h2 style="text-align:center;">🕉️ Admin Login</h2>
    <p style="text-align:center;color:var(--brown-soft);font-size:0.9rem;margin-bottom:24px;">Annapurna Bhakti Bhandar — Shop Owner Panel</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="error-text" id="loginError" style="display:none;margin-top:10px;"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;" id="loginBtn">Login</button>
    </form>
    <p style="font-size:0.75rem;color:var(--brown-soft);text-align:center;margin-top:18px;">
      Default demo credentials come from ADMIN_EMAIL / ADMIN_PASSWORD in .env — change these before real use.
    </p>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginError");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Logging in...";
  try {
    const data = await api.adminLogin(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
    localStorage.setItem("abb_admin_token", data.access_token);
    window.location.href = "admin/dashboard.html";
  } catch (err) {
    errEl.textContent = err.message || "Login failed";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Login";
  }
});

mountLayout("");
</script>
</body>
</html>
