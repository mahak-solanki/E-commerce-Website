<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Annapurna Bhakti Bhandar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</div>
    <h1>Checkout</h1>
  </div>
</div>

<div class="container" style="padding:30px 0 60px;">
  <div id="checkoutContent"></div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
function renderCheckout() {
  const cart = getCart();
  const el = document.getElementById("checkoutContent");

  if (cart.length === 0) {
    el.innerHTML = `
    <div class="empty-state">
      <div class="icon">🛒</div>
      <h3>Your cart is empty</h3>
      <p>Add some products before checking out.</p>
      <a href="products.html" class="btn btn-primary">Shop Now</a>
    </div>`;
    return;
  }

  const subtotal = cartSubtotal();

  el.innerHTML = `
  <div class="cart-layout">
    <div>
      <div class="summary-card" style="margin-bottom:22px;">
        <h3 style="margin-top:0;">Delivery Details</h3>
        <form id="checkoutForm">
          <div class="form-grid">
            <div class="form-group full">
              <label>Full Name *</label>
              <input type="text" id="customer_name" required>
              <div class="error-text" id="err_customer_name"></div>
            </div>
            <div class="form-group">
              <label>Mobile Number *</label>
              <input type="tel" id="phone" required placeholder="10 digit mobile number">
              <div class="error-text" id="err_phone"></div>
            </div>
            <div class="form-group">
              <label>Email (optional)</label>
              <input type="email" id="email">
              <div class="error-text" id="err_email"></div>
            </div>
            <div class="form-group">
              <label>House / Flat Number *</label>
              <input type="text" id="house_number" required>
              <div class="error-text" id="err_house_number"></div>
            </div>
            <div class="form-group">
              <label>Street / Area *</label>
              <input type="text" id="street" required>
              <div class="error-text" id="err_street"></div>
            </div>
            <div class="form-group">
              <label>City *</label>
              <input type="text" id="city" required>
              <div class="error-text" id="err_city"></div>
            </div>
            <div class="form-group">
              <label>State *</label>
              <input type="text" id="state" required>
              <div class="error-text" id="err_state"></div>
            </div>
            <div class="form-group">
              <label>Pincode *</label>
              <input type="text" id="pincode" required placeholder="6 digit pincode">
              <div class="error-text" id="err_pincode"></div>
            </div>
            <div class="form-group">
              <label>Landmark (optional)</label>
              <input type="text" id="landmark">
            </div>
            <div class="form-group full">
              <label>Delivery Instructions (optional)</label>
              <textarea id="delivery_instructions" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="summary-card">
        <h3 style="margin-top:0;">Payment Method</h3>
        <div class="payment-option">💰 Cash on Delivery (COD)</div>
        <p style="font-size:0.8rem;color:var(--brown-soft);margin-top:10px;">
          Online payment (UPI/Razorpay) will be available soon. Pay in cash when your order is delivered.
        </p>
      </div>
    </div>
    <div class="summary-card">
      <h3 style="margin-top:0;">Order Summary</h3>
      ${cart.map(i => `
        <div class="summary-row"><span>${i.name} × ${i.quantity}</span><span>${money(i.price * i.quantity)}</span></div>
      `).join("")}
      <div class="summary-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div class="summary-row"><span>Delivery Charge</span><span id="deliveryChargeLine">—</span></div>
      <div class="summary-row total"><span>Total</span><span id="totalLine">${money(subtotal)}</span></div>
      <button class="btn btn-primary btn-block" id="placeOrderBtn" style="margin-top:16px;" onclick="submitOrder()">Place Order</button>
      <p style="font-size:0.75rem;color:var(--brown-soft);margin-top:10px;text-align:center;">
        By placing this order you agree to pay via Cash on Delivery.
      </p>
    </div>
  </div>`;

  loadDeliveryEstimate(subtotal);
}

async function loadDeliveryEstimate(subtotal) {
  try {
    const cfg = await api.getConfig();
    const charge = subtotal >= cfg.free_delivery_above ? 0 : cfg.delivery_charge;
    document.getElementById("deliveryChargeLine").textContent = charge === 0 ? "FREE" : money(charge);
    document.getElementById("totalLine").textContent = money(subtotal + charge);
  } catch (e) {}
}

function clearErrors() {
  document.querySelectorAll(".error-text").forEach(e => { e.style.display = "none"; e.textContent = ""; });
}

function showFieldError(field, msg) {
  const el = document.getElementById("err_" + field);
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

function validateForm() {
  clearErrors();
  let valid = true;
  const name = document.getElementById("customer_name").value.trim();
  const phone = document.getElementById("phone").value.replace(/\D/g, "");
  const email = document.getElementById("email").value.trim();
  const house = document.getElementById("house_number").value.trim();
  const street = document.getElementById("street").value.trim();
  const city = document.getElementById("city").value.trim();
  const state = document.getElementById("state").value.trim();
  const pincode = document.getElementById("pincode").value.trim();

  if (!name) { showFieldError("customer_name", "Full name is required"); valid = false; }
  if (!/^\d{10}$/.test(phone)) { showFieldError("phone", "Enter a valid 10 digit mobile number"); valid = false; }
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showFieldError("email", "Enter a valid email address"); valid = false; }
  if (!house) { showFieldError("house_number", "House/Flat number is required"); valid = false; }
  if (!street) { showFieldError("street", "Street/Area is required"); valid = false; }
  if (!city) { showFieldError("city", "City is required"); valid = false; }
  if (!state) { showFieldError("state", "State is required"); valid = false; }
  if (!/^\d{6}$/.test(pincode)) { showFieldError("pincode", "Enter a valid 6 digit pincode"); valid = false; }

  return valid;
}

async function submitOrder() {
  if (!validateForm()) {
    showToast("Please fix the errors in the form", "error");
    return;
  }
  const btn = document.getElementById("placeOrderBtn");
  btn.disabled = true;
  btn.textContent = "Placing Order...";

  const payload = {
    customer_name: document.getElementById("customer_name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: document.getElementById("email").value.trim(),
    house_number: document.getElementById("house_number").value.trim(),
    street: document.getElementById("street").value.trim(),
    city: document.getElementById("city").value.trim(),
    state: document.getElementById("state").value.trim(),
    pincode: document.getElementById("pincode").value.trim(),
    landmark: document.getElementById("landmark").value.trim(),
    delivery_instructions: document.getElementById("delivery_instructions").value.trim(),
    items: getCart().map(i => ({ product_id: i.product_id, quantity: i.quantity })),
  };

  try {
    const order = await api.placeOrder(payload);
    clearCart();
    window.location.href = `order-success.html?order_id=${order.order_id}`;
  } catch (e) {
    showToast(e.message || "Could not place order", "error");
    btn.disabled = false;
    btn.textContent = "Place Order";
  }
}

renderCheckout();
mountLayout("");
</script>
</body>
</html>
