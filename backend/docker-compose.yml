version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna_change_me
      POSTGRES_DB: annapurna_db
    volumes:
      - annapurna_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://annapurna:annapurna_change_me@db:5432/annapurna_db
      SECRET_KEY: CHANGE_ME_super_secret_key_please_replace
      ADMIN_EMAIL: admin@change-me.com
      ADMIN_PASSWORD: ChangeMe@123
      SHOP_NAME: Annapurna Bhakti Bhandar
      SHOP_PHONE: CHANGE_ME
      SHOP_EMAIL: CHANGE_ME
      SHOP_ADDRESS: CHANGE_ME
      WHATSAPP_NUMBER: CHANGE_ME
      CORS_ORIGINS: "*"
      DELIVERY_CHARGE: "50"
      FREE_DELIVERY_ABOVE: "999"
    ports:
      - "8000:8000"

volumes:
  annapurna_pg_data:
